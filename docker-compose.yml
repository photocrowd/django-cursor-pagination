services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: django-cursor-pagination
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d django-cursor-pagination"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: