name: Tests

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        django-version: ["4.2", "5.0", "5.2", "6.0"]
        exclude:
          - python-version: "3.10"
            django-version: "6.0"
          - python-version: "3.11"
            django-version: "6.0"

    services:
      postgres:
        image: postgres
        ports: ["5432:5432"]

        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: django-cursor-pagination

    steps:
      - uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Django
        run: pip install django==${{ matrix.django-version }}
      - run: pip install psycopg2
      - run: pip install -e .
      - run: python runtests.py

  type-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.12"
      - run: pip install mypy django-stubs
      - run: mypy cursor_pagination/ --strict --ignore-missing-imports
